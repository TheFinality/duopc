name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    # The fold API (reservedRegions) is in the iOS 27.1 SDK, so this needs the Xcode 27 image;
    # macos-latest tops out at Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          xcrun simctl list runtimes | grep -i ios

      - name: Build (simulator, no signing)
        run: |
          xcodebuild build -project DuoRemote.xcodeproj -scheme DuoRemote \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          sim=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          names = [d["name"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(names[-1])')
          xcodebuild test -project DuoRemote.xcodeproj -scheme DuoRemote \
            -destination "platform=iOS Simulator,name=$sim" CODE_SIGNING_ALLOWED=NO

  # An unsigned app for sideloading from Windows (Sideloadly / AltStore sign it with your Apple ID).
  ipa:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Build for iPhone (Release, unsigned)
        run: |
          xcodebuild build -project DuoRemote.xcodeproj -scheme DuoRemote -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package DuoPC.ipa
        run: |
          app=build/Build/Products/Release-iphoneos/DuoRemote.app
          test -d "$app"
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../DuoPC.ipa Payload)
          ls -l DuoPC.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' "$app/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: DuoPC-ipa
          path: DuoPC.ipa
          retention-days: 30
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and test DuoPC Gateway end to end
        shell: powershell
        run: ./windows/tests/run-gateway-test.ps1
      - name: Parse Setup-DuoPC.ps1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\windows\Setup-DuoPC.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          'parsed ok'
